<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('编辑调压站档案')"/>
</head>
<body>
<form class="layui-form">
    <input type="hidden" name="id" th:value="${station.id}">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">调压站编号</label>
                <div class="layui-input-inline" style="width: 220px;">
                    <input type="text" name="stationNo" th:value="${station.stationNo}" readonly
                           class="layui-input layui-disabled">
                </div>
                <div class="layui-form-mid layui-word-aux">编号建档后不可改；档案严禁删除</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">当前状态</label>
                <div class="layui-input-inline" style="width: 160px;">
                    <select name="status">
                        <option value="0" th:selected="${station.status == 0}">在用</option>
                        <option value="1" th:selected="${station.status == 1}">停用</option>
                        <option value="2" th:selected="${station.status == 2}">报废</option>
                    </select>
                </div>
                <label class="layui-form-label">建成年份</label>
                <div class="layui-input-inline" style="width: 120px;">
                    <input type="number" name="layYear" th:value="${station.layYear}" min="1900"
                           class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">调压站名称</label>
                <div class="layui-input-block">
                    <input type="text" name="stationName" th:value="${station.stationName}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">站址坐标</label>
                <div class="layui-input-inline" style="width: 160px;">
                    <input type="number" step="0.000001" name="lng" th:value="${station.lng}" class="layui-input">
                </div>
                <div class="layui-input-inline" style="width: 160px;">
                    <input type="number" step="0.000001" name="lat" th:value="${station.lat}" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">须为中国境内有效读数</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">管径描述</label>
                <div class="layui-input-inline" style="width: 170px;">
                    <input type="text" name="diameter" th:value="${station.diameter}" class="layui-input">
                </div>
                <label class="layui-form-label">主体材质</label>
                <div class="layui-input-inline" style="width: 150px;">
                    <select name="material">
                        <option value="">请选择</option>
                        <option th:selected="${station.material == '钢管'}">钢管</option>
                        <option th:selected="${station.material == 'PE管'}">PE管</option>
                        <option th:selected="${station.material == '铸铁管'}">铸铁管</option>
                        <option th:selected="${station.material == '球墨铸铁管'}">球墨铸铁管</option>
                        <option th:selected="${station.material == '其他'}">其他</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">设备型号</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="text" name="deviceModel" th:value="${station.deviceModel}" class="layui-input">
                </div>
                <label class="layui-form-label">设备厂家</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="text" name="manufacturer" th:value="${station.manufacturer}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">设计压力(MPa)</label>
                <div class="layui-input-inline" style="width: 140px;">
                    <input type="number" step="0.01" min="0" name="designPressure"
                           th:value="${station.designPressure}" class="layui-input">
                </div>
                <label class="layui-form-label">出口压力(MPa)</label>
                <div class="layui-input-inline" style="width: 140px;">
                    <input type="number" step="0.0001" min="0" name="outletPressure"
                           th:value="${station.outletPressure}" class="layui-input">
                </div>
                <label class="layui-form-label">额定流量(m³/h)</label>
                <div class="layui-input-inline" style="width: 140px;">
                    <input type="number" step="0.01" min="0" name="ratedFlow" th:value="${station.ratedFlow}"
                           class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">所属区域</label>
                <div class="layui-input-inline" style="width: 130px;">
                    <select id="province_select" lay-filter="province_select"></select>
                </div>
                <div class="layui-input-inline" style="width: 130px;">
                    <select id="city_select" lay-filter="city_select"></select>
                </div>
                <div class="layui-input-inline" style="width: 130px;">
                    <select id="area_select" lay-filter="area_select"></select>
                </div>
                <div class="layui-input-inline" style="width: 140px;">
                    <select id="street_select" lay-filter="street_select"></select>
                </div>
                <div class="layui-input-inline" style="width: 150px;">
                    <select id="zone_select" name="zoneId" lay-verify="required"></select>
                </div>
                <div class="layui-form-mid layui-word-aux">片区划转后保存即生效</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" th:text="${station.remark}"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="station-save">
                <i class="layui-icon layui-icon-ok"></i>
                保存变更
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script th:src="@{/static/admin/js/gasRegionLinkage.js}"></script>
<script th:inline="javascript">
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/gasStation/";

        GasRegionLinkage.init({
            form: form, $: $,
            selected: {
                provinceCode: [[${station.provinceCode}]],
                cityCode: [[${station.cityCode}]],
                areaCode: [[${station.areaCode}]],
                streetCode: [[${station.streetCode}]],
                zoneId: [[${station.zoneId}]]
            }
        });

        form.on('submit(station-save)', function (data) {
            let f = data.field;
            if (f.lng === '' || f.lat === '' || Number(f.lng) < 73 || Number(f.lng) >= 136
                || Number(f.lat) < 3 || Number(f.lat) >= 54) {
                layer.msg('站址坐标无效', {icon: 2});
                return false;
            }
            $.ajax({
                url: MODULE_PATH + 'edit',
                data: f, dataType: 'json', type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg, {icon: 1, time: 1500}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("gasStation-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 2200});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
