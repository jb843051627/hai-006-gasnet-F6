<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('编辑规则版本')"/>
</head>
<body>
<form class="layui-form" th:object="${rule}">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item layui-hide">
                <label class="layui-form-label">编号</label>
                <div class="layui-input-block">
                    <input type="text" th:value="*{id}" name="id" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">规则代号</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="text" th:value="*{ruleCode}" readonly class="layui-input layui-disabled">
                </div>
                <div class="layui-form-mid">
                    版本 <b th:text="'V' + *{version}">V1</b>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">判线名</label>
                <div class="layui-input-block">
                    <input type="text" th:value="*{ruleName}" name="ruleName" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">轻度上限</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="number" step="0.01" min="0" th:value="*{th1Max}" name="th1Max"
                           autocomplete="off" class="layui-input threshold-input">
                </div>
                <div class="layui-form-mid layui-word-aux">ppm</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">中度上限</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="number" step="0.01" min="0" th:value="*{th2Max}" name="th2Max"
                           autocomplete="off" class="layui-input threshold-input">
                </div>
                <div class="layui-form-mid layui-word-aux">ppm</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">严重上限</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="number" step="0.01" min="0" th:value="*{th3Max}" name="th3Max"
                           autocomplete="off" class="layui-input threshold-input">
                </div>
                <div class="layui-form-mid layui-word-aux">ppm</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">生效日</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="text" th:value="${#dates.format(rule.effStart, 'yyyy-MM-dd HH:mm:ss')}"
                           name="effStart" id="effStart" autocomplete="off"
                           class="layui-input threshold-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">交棒日</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="text" th:value="${rule.effEnd == null ? '' : #dates.format(rule.effEnd, 'yyyy-MM-dd HH:mm:ss')}"
                           readonly class="layui-input layui-disabled">
                </div>
                <div class="layui-form-mid layui-word-aux">停用/发布新版时自动写入，不可手改</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">优先级</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="number" th:value="*{priority}" name="priority" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" th:text="*{remark}"></textarea>
                </div>
            </div>
            <div class="layui-bg-orange" style="padding: 8px 12px; margin: 0 15px 10px; border-radius: 4px; display: none;"
                 id="frozen-tip">
                该版本已生效，阈值与生效日已冻结（改阈值请为该代号「发布新版本」），此处仅可修改判线名/优先级/备注。
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit
                    lay-filter="rule-update">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/gasConcRule/";

        // 已生效版本（生效日不晚于当前）冻结阈值与生效日
        let effStart = $('input[name="effStart"]').val();
        if (effStart && new Date(effStart.replace(/-/g, '/')) <= new Date()) {
            $('.threshold-input').attr('readonly', true).addClass('layui-disabled');
            $('#frozen-tip').show();
        }

        form.on('submit(rule-update)', function (data) {
            $.ajax({
                url: MODULE_PATH + 'edit',
                data: data.field, dataType: 'json',
                contentType: 'application/x-www-form-urlencoded', type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("gasConcRule-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 1500});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
