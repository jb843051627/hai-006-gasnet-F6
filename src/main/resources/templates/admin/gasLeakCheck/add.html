<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('泄漏浓度检测录入')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">检测时间</label>
                <div class="layui-input-inline" style="width: 220px;">
                    <input type="text" name="detectTime" id="detectTime" lay-verify="required"
                           autocomplete="off" placeholder="现场检测时间" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">据此定位当时在用规则版本</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">检测点代号</label>
                <div class="layui-input-inline" style="width: 220px;">
                    <input type="text" name="siteNo" autocomplete="off" placeholder="如 GP00-V01" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">检测点名称</label>
                <div class="layui-input-block">
                    <input type="text" name="siteName" autocomplete="off" placeholder="如 城东调压站柜内"
                           class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">浓度读数</label>
                <div class="layui-input-inline" style="width: 220px;">
                    <input type="number" step="0.01" min="0" name="concValue" lay-verify="required"
                           autocomplete="off" placeholder="ppm" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">ppm</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">指定判线</label>
                <div class="layui-input-inline" style="width: 220px;">
                    <input type="text" name="ruleCode" autocomplete="off"
                           placeholder="留空则取当时优先级最高的判线" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">规则代号，可留空</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" placeholder=""></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="check-save">
                <i class="layui-icon layui-icon-ok"></i>
                评定入库
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery', 'laydate'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let laydate = layui.laydate;
        let MODULE_PATH = rootPath + "/gasLeakCheck/";

        laydate.render({
            elem: '#detectTime', type: 'datetime', format: 'yyyy-MM-dd HH:mm:ss',
            value: new Date()
        });

        form.on('submit(check-save)', function (data) {
            $.ajax({
                url: MODULE_PATH + 'add',
                data: data.field, dataType: 'json',
                contentType: 'application/x-www-form-urlencoded', type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg, {icon: 1, time: 1500}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("gasLeakCheck-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 1800});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
