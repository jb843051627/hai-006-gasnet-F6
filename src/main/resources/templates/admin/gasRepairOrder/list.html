<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('抢修工单流转台账')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">工单号</label>
                <div class="layui-input-inline">
                    <input type="text" name="bizNo" placeholder="" class="layui-input">
                </div>

                <label class="layui-form-label">当前阶段</label>
                <div class="layui-input-inline">
                    <select name="stage">
                        <option value="">全部</option>
                        <option value="0">待接单</option>
                        <option value="1">已接单</option>
                        <option value="2">抢修中</option>
                        <option value="3">待复核</option>
                        <option value="4">待封卡</option>
                        <option value="5">已封存</option>
                    </select>
                </div>

                <label class="layui-form-label">工单状态</label>
                <div class="layui-input-inline">
                    <select name="status">
                        <option value="">全部</option>
                        <option value="0">待接单</option>
                        <option value="1">在办</option>
                        <option value="2">已封存</option>
                    </select>
                </div>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="gasRepairOrder-query">
                    <i class="layui-icon layui-icon-search"></i>
                    查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i>
                    重置
                </button>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="gasRepairOrder-table" lay-filter="gasRepairOrder-table"></table>
    </div>
</div>
</body>

<script type="text/html" id="gasRepairOrder-toolbar">
    <button shiro:hasPermission="gasRepairOrder:add" class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        新建抢修工单
    </button>
</script>

<script type="text/html" id="gasRepairOrder-bar">
    {{# if(d.stage == 0){ }}
    <button shiro:hasPermission="gasRepairOrder:claim" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="claim" title="接单"><i class="layui-icon layui-icon-username"></i>
    </button>
    {{# } }}
    {{# if(d.stage == 1){ }}
    <button shiro:hasPermission="gasRepairOrder:start" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="start" title="开始抢修"><i class="layui-icon layui-icon-play"></i>
    </button>
    {{# } }}
    {{# if(d.stage == 2){ }}
    <button shiro:hasPermission="gasRepairOrder:submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="submitResult" title="提交抢修结果"><i class="layui-icon layui-icon-edit"></i>
    </button>
    {{# } }}
    {{# if(d.stage == 3){ }}
    <button shiro:hasPermission="gasRepairOrder:review" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="review" title="现场复核"><i class="layui-icon layui-icon-survey"></i>
    </button>
    {{# } }}
    {{# if(d.stage == 4){ }}
    <button shiro:hasPermission="gasRepairOrder:seal" class="pear-btn pear-btn-danger pear-btn-sm" lay-event="seal" title="完工封卡（永久封存）"><i class="layui-icon layui-icon-auz"></i>
    </button>
    {{# } }}
    {{# if(d.stage == 5){ }}
    <span class="layui-badge layui-bg-gray">已永久封存</span>
    {{# } }}
    <button shiro:hasPermission="gasRepairOrder:list" class="pear-btn pear-btn-sm" lay-event="records" title="处置履历"><i class="layui-icon layui-icon-log"></i>
    </button>
</script>

<script type="text/html" id="gasRepairOrder-stage">
    {{# if(d.stage == 0){ }}
    <span class="layui-badge layui-bg-orange">待接单</span>
    {{# }else if(d.stage == 1){ }}
    <span class="layui-badge layui-bg-blue">已接单</span>
    {{# }else if(d.stage == 2){ }}
    <span class="layui-badge layui-bg-blue">抢修中</span>
    {{# }else if(d.stage == 3){ }}
    <span class="layui-badge layui-bg-cyan">待复核</span>
    {{# }else if(d.stage == 4){ }}
    <span class="layui-badge layui-bg-orange">待封卡</span>
    {{# }else if(d.stage == 5){ }}
    <span class="layui-badge layui-bg-gray">已封存</span>
    {{# } }}
</script>

<script type="text/html" id="gasRepairOrder-overdue">
    {{# if(d.overdue){ }}
    <span class="layui-badge">已超期</span>
    {{# } else { }}
    <span class="layui-badge layui-bg-green">正常</span>
    {{# } }}
</script>

<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'form', 'jquery'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;

        let MODULE_PATH = rootPath+"/gasRepairOrder/";
        let cols = [
            [
                {title: 'ID', field: 'id', align: 'center', hide: true},
                {title: '工单号', field: 'bizNo', align: 'left', width: 165},
                {title: '险情记事', field: 'content', align: 'left'},
                {title: '当前阶段', field: 'stage', align: 'center', toolbar: '#gasRepairOrder-stage'},
                {title: '时限情况', field: 'overdue', align: 'center', toolbar: '#gasRepairOrder-overdue'},
                {title: '处置时限', field: 'dueAt', align: 'center', width: 160},
                {title: '负责人', field: 'ownerName', align: 'center', width: 90},
                {title: '接单人', field: 'assigneeName', align: 'center', width: 90},
                {title: '预警次数', field: 'warnCount', align: 'center', width: 90},
                {title: '建单时间', field: 'createTime', align: 'center', width: 160},
                {title: '操作', toolbar: '#gasRepairOrder-bar', align: 'center', width: 130}
            ]
        ]

        //table表单列表
        table.render({
            elem: '#gasRepairOrder-table',
            url: MODULE_PATH + 'list',
            page: true,
            method: 'get',
            cols: cols,
            skin: 'line',
            toolbar: '#gasRepairOrder-toolbar',
            defaultToolbar: [{
                layEvent: 'refresh',
                icon: 'layui-icon-refresh',
            }, 'filter', 'print', 'exports'],
            where: {
                orderByColumn: "id",
                isAsc: "desc"
            }
        });

        //table图标事件绑定
        table.on('tool(gasRepairOrder-table)', function (obj) {
            if (obj.event === 'claim') {
                window.act(obj.data['id'], 'claim', '接单', '接单备注（赶赴现场安排，可空）');
            } else if (obj.event === 'start') {
                window.act(obj.data['id'], 'start', '开始抢修', '抢修安排/已采取措施（可空）');
            } else if (obj.event === 'submitResult') {
                window.submitResult(obj.data['id']);
            } else if (obj.event === 'review') {
                window.act(obj.data['id'], 'review', '现场复核', '复核意见（现场检测与结果核验情况，可空）');
            } else if (obj.event === 'seal') {
                window.seal(obj.data['id']);
            } else if (obj.event === 'records') {
                window.records(obj.data['id']);
            }
        });

        //table工具栏绑定
        table.on('toolbar(gasRepairOrder-table)', function (obj) {
            if (obj.event === 'add') {
                window.add();
            } else if (obj.event === 'refresh') {
                window.refresh();
            }
        });

        //查询按钮绑定
        form.on('submit(gasRepairOrder-query)', function (data) {
            table.reload('gasRepairOrder-table', {where: data.field})
            return false;
        });

        //新建抢修工单
        window.add = function () {
            layer.open({
                type: 2,
                title: '新建抢修工单',
                shade: 0.1,
                area: ['560px', '520px'],
                content: MODULE_PATH + 'addView'
            });
        }

        //一般过口动作：接单/开始抢修/现场复核（统一录入备注）
        window.act = function (id, action, title, placeholder) {
            layer.prompt({
                formType: 2,
                title: title,
                area: ['420px', '170px'],
                placeholder: placeholder
            }, function (value, index) {
                layer.close(index);
                window.postAction(action, {id: id, remark: value});
            });
        }

        //提交抢修结果：抢修结果必填
        window.submitResult = function (id) {
            layer.prompt({
                formType: 2,
                title: '提交抢修结果',
                area: ['460px', '220px'],
                placeholder: '请填写抢修结果（处置措施、更换部件、气密性试验、恢复供气情况等），必填'
            }, function (value, index) {
                if ($.trim(value) === '') {
                    layer.msg('抢修结果不能为空', {icon: 2, time: 1500});
                    return;
                }
                layer.close(index);
                window.postAction('submitResult', {id: id, repairResult: value});
            });
        }

        //完工封卡：二次确认永久封存
        window.seal = function (id) {
            layer.confirm('完工封卡后该工单将<b>永久封存</b>，履历与全部内容不得再修改。确认封卡？', {
                title: '完工封卡确认',
                area: ['420px', '200px'],
                icon: 3,
                btn: ['确认封卡', '取消']
            }, function (confIndex) {
                layer.close(confIndex);
                layer.prompt({
                    formType: 2,
                    title: '完工封卡备注',
                    area: ['420px', '160px'],
                    placeholder: '封卡意见（资料归档情况，可空）'
                }, function (value, pIndex) {
                    layer.close(pIndex);
                    window.postAction('seal', {id: id, remark: value});
                });
            });
        }

        window.postAction = function (action, postData) {
            let loading = layer.load();
            $.ajax({
                url: MODULE_PATH + action,
                data: postData,
                dataType: 'json',
                type: 'post',
                success: function (result) {
                    layer.close(loading);
                    if (result.code == 200) {
                        layer.msg(result.msg, {icon: 1, time: 1500}, function () {
                            table.reload('gasRepairOrder-table');
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 2000});
                    }
                }
            });
        }

        //处置履历
        window.records = function (orderId) {
            layer.open({
                type: 2,
                title: '抢修处置履历',
                shade: 0.1,
                area: ['780px', '500px'],
                content: MODULE_PATH + 'recordView?orderId=' + orderId
            });
        }

        //刷新
        window.refresh = function () {
            table.reload('gasRepairOrder-table');
        }
    });
</script>
</html>
